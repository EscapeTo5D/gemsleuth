name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path target/release/gemsleuth.exe -DestinationPath "gemsleuth-${env:GITHUB_REF_NAME}-windows-x64.zip"
      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${env:GITHUB_REF_NAME}" "gemsleuth-${env:GITHUB_REF_NAME}-windows-x64.zip" --generate-notes --title "${env:GITHUB_REF_NAME}"
